[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracefang"
version = "0.1.0"
description = "Provider-neutral market data and trading analysis platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "asyncpg>=0.30,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "nats-py>=2.15,<3",
  "python-dotenv>=1.1,<2",
  "tzdata>=2025.2",
  "uvicorn[standard]>=0.35,<1",
  "websockets>=15,<18",
]

[project.scripts]
tracefang = "tracefang.cli:main"
tracefang-server = "tracefang.api:run"
tracefang-service = "tracefang.service:main"

[dependency-groups]
dev = [
  "ruff>=0.12,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
